<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Phiếu Lấy Thông Tin</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #dff6f6, #ffffff);
    }

    h1 {
        text-align: center;
        margin-top: 30px;
        color: #333;
    }

    .author {
        text-align: center;
        font-weight: bold;
        color: #4cc7c7;
        margin-bottom: 10px;
    }

    fieldset {
        width: 520px;
        margin: 20px auto;
        border: 4px solid #4cc7c7;
        border-radius: 15px;
        padding: 25px;
        background: white;
        box-shadow: 0 8px 15px rgba(0,0,0,0.1);
    }

    legend {
        font-size: 20px;
        font-weight: bold;
        color: #ff4d4d;
        padding: 5px 15px;
        background: white;
        border-radius: 10px;
    }

    table {
        width: 100%;
    }

    th {
        text-align: left;
        padding-bottom: 10px;
        color: #555;
        vertical-align: top;
    }

    td {
        padding-bottom: 12px;
    }

    input, select {
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    input[type="radio"], input[type="checkbox"] {
        width: auto;
        margin-right: 5px;
    }

    .inline {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .hidden {
        display: none;
    }

    button {
        background: #4cc7c7;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 10px;
        cursor: pointer;
    }

    button:hover {
        background: #38a9a9;
    }

    .note {
        font-size: 13px;
        color: red;
    }

    .footer {
        text-align: center;
        margin-top: 15px;
        font-style: italic;
        color: #777;
    }
</style>

<script>
function showSubjects(type) {
    document.getElementById("tn").classList.add("hidden");
    document.getElementById("xh").classList.add("hidden");

    document.querySelectorAll(".mon").forEach(cb => cb.checked = false);

    if (type === "tn") {
        document.getElementById("tn").classList.remove("hidden");
    } else {
        document.getElementById("xh").classList.remove("hidden");
    }
}

function limitCheckbox() {
    let checked = document.querySelectorAll('.mon:checked');
    if (checked.length > 2) {
        alert("Chỉ được chọn tối đa 2 môn!");
        this.checked = false;
    }
}

window.onload = function() {
    document.querySelectorAll('.mon').forEach(cb => {
        cb.addEventListener('change', limitCheckbox);
    });
}
</script>

</head>

<body>

<h1>Đăng ký môn thi tốt nghiệp – Lớp 12A7</h1>
<fieldset>
    <legend>Nhập thông tin</legend>

    <form>
        <table>
            <tr>
                <th>Họ và tên:</th>
                <td><input type="text" value="Đặng Nữ Ái Mỹ"></td>
            </tr>

            <tr>
                <th>Lớp:</th>
                <td>
                    <select>
                        <option>12A7</option>
                        <option>12A6</option>
                        <option>12A5</option>
                        <option>12A4</option>
                        <option>12A3</option>
                        <option>12A2</option>
                        <option>12A1</option>
                    </select>
                </td>
            </tr>

            <tr>
                <th>Ngày sinh:</th>
                <td><input type="date" value="2008-01-12"></td>
            </tr>

            <tr>
                <th>Tổ hợp:</th>
                <td class="inline">
                    <label><input type="radio" name="tohop" onclick="showSubjects('tn')"> Tự nhiên</label>
                    <label><input type="radio" name="tohop" onclick="showSubjects('xh')"> Xã hội</label>
                </td>
            </tr>

            <tr>
                <th>Môn thi:</th>
                <td>
                    <b>Bắt buộc:</b> Toán, Văn <br><br>

                    <div id="tn" class="hidden">
                        <b>Chọn 2 môn:</b><br>
                        <div class="inline">
                            <label><input type="checkbox" class="mon"> Vật lí</label>
                            <label><input type="checkbox" class="mon"> Hóa học</label>
                            <label><input type="checkbox" class="mon"> Sinh học</label>
                            <label><input type="checkbox" class="mon"> Lịch sử</label>
                            <label><input type="checkbox" class="mon"> Tiếng Anh</label>
                        </div>
                    </div>

                    <div id="xh" class="hidden">
                        <b>Chọn 2 môn:</b><br>
                        <div class="inline">
                            <label><input type="checkbox" class="mon"> Địa lí</label>
                            <label><input type="checkbox" class="mon"> GD Kinh tế & PL</label>
                            <label><input type="checkbox" class="mon"> Lịch sử</label>
                            <label><input type="checkbox" class="mon"> Tiếng Anh</label>
                            <label><input type="checkbox" class="mon"> Hóa học</label>
                            <label><input type="checkbox" class="mon"> Tin học</label>
                        </div>
                    </div>

                    <div class="note">* Chỉ được chọn tối đa 2 môn</div>
                </td>
            </tr>

            <tr>
                <td colspan="2" style="text-align:center;">
                    <button type="submit">Gửi thông tin</button>
                </td>
            </tr>
        </table>
    </form>
</fieldset>
</body>
</html>
